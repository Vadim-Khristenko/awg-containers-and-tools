[workspace]
resolver = "2"
# containers/dns-chain is built on its own inside the resolver image too, so it
# keeps a self-contained manifest and no dependencies.
members = ["crates/awg-core", "crates/awg-cli", "containers/dns-chain"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"   # edition 2024 needs 1.85; 1.90 is the floor we actually test against
license = "MIT"
repository = "https://github.com/Vadim-Khristenko/awg-containers-and-tools"

[workspace.dependencies]
awg-core = { path = "crates/awg-core" }
rand = "0.10"
base64 = "0.23"
thiserror = "2"
flate2 = "1.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# vendored-openssl builds OpenSSL from source: the containers this ships in have
# no libssh2 and no system OpenSSL headers to link against. On Windows the
# build needs a native Perl (Strawberry) first on PATH — the MSYS2/Cygwin perl
# mangles backslash paths and `openssl-src` refuses it — plus the MSVC
# compiler on PATH (`vcvars64.bat`). CI builds Linux, where none of this
# applies; so do the images.
#
# openssl-on-win32: on Windows libssh2 otherwise uses WinCNG, which has no
# curve25519, no ECDH and no ed25519, and offers only finite-field
# Diffie-Hellman. OpenSSH 10 accepts none of those, so a Windows build could
# not open a session with a current server at all.
ssh2 = { version = "0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>amiunder.vpn</title>
<link rel="stylesheet" href="architect.css">
<!--
  Served from inside the tunnel only. Every name this page answers to
  (amiunder, dns, speed, mtu, node and any <nonce>.leak.vpn) resolves through
  the tunnel's own resolver and the address is reachable only through the
  tunnel, so the page loading at all is the first answer. Everything on it is
  computed locally or fetched from this same host: no external requests, no
  third-party speed test, no analytics, no font CDNs. A page whose whole point
  is privacy does not leak to render itself.

  One page for all of them: app.js reads the name it was opened by and draws
  that page. The theme comes from architect.css, the kit itself; what is left
  here is only the layout the kit has no opinion about.
-->
<style>
    body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--sp-5);
        font-family: var(--fw);
    }
    .status-card {
        width: 100%;
        max-width: 560px;
        padding: var(--sp-6) var(--sp-5);
        text-align: center;
    }
    .status-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--sp-3);
        margin-bottom: var(--sp-4);
    }
    .status-brand {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
        text-align: left;
        overflow-wrap: anywhere;
    }
    .status-brand b { color: var(--accent-ink); }
    .lang { display: flex; gap: var(--sp-1); flex: none; }
    .lang button, .pages a {
        border: var(--rule) solid var(--line);
        background: transparent;
        color: var(--ink-3);
        font: inherit;
        font-size: 0.72rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: var(--r-pill);
        cursor: pointer;
        text-decoration: none;
    }
    .lang button.on, .pages a.on {
        border-color: var(--accent);
        color: var(--accent-ink);
        background: rgb(var(--accent-rgb) / 0.12);
    }
    .pages {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--sp-1);
        margin-bottom: var(--sp-5);
    }
    .verdict {
        font-size: 2.4rem;
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: var(--sp-2);
        color: var(--counter);
        overflow-wrap: anywhere;
    }
    .verdict.bad { color: var(--ink); }
    .verdict-sub {
        color: var(--ink-3);
        font-size: var(--t-sm);
        margin-bottom: var(--sp-5);
    }
    .rows {
        display: grid;
        gap: var(--sp-2);
        text-align: left;
        margin-bottom: var(--sp-5);
    }
    .row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: var(--sp-3);
        background: var(--ground-3);
        border: var(--rule) solid var(--line-soft);
        border-radius: var(--r-2);
        padding: var(--sp-2) var(--sp-3);
        font-size: var(--t-sm);
    }
    .row .k { color: var(--ink-3); }
    .row .v {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: right;
        overflow-wrap: anywhere;
    }
    .row .v.pending { color: var(--ink-3); font-weight: 400; }
    .row .v.bad { color: var(--red); }
    a.row { color: inherit; text-decoration: none; }
    a.row:hover { border-color: var(--accent); }
    .wide-btn { width: 100%; height: 44px; }
    .ask { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-3); }
    .ask input {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: var(--t-sm);
        color: var(--ink);
        background: var(--ground-3);
        border: var(--rule) solid var(--line);
        border-radius: var(--r-2);
        padding: var(--sp-2) var(--sp-3);
    }
    .ask button { height: auto; }
    .note {
        text-align: left;
        font-size: var(--t-sm);
        color: var(--ink-2);
        line-height: 1.5;
        margin-bottom: var(--sp-4);
    }
    .meter {
        height: 6px;
        background: var(--ground-3);
        border-radius: var(--r-pill);
        margin-top: var(--sp-3);
        overflow: hidden;
    }
    .meter i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--accent);
        border-radius: var(--r-pill);
        transition: width 0.2s;
    }
    .status-foot {
        margin-top: var(--sp-5);
        font-size: 0.72rem;
        color: var(--ink-3);
        line-height: 1.5;
    }
</style>
</head>
<body>
<div class="card status-card">
    <div class="status-top">
        <div class="status-brand">Any Tech <b>ARCHITECT</b> · <span id="host">amiunder.vpn</span></div>
        <div class="lang">
            <button id="lang-ru" type="button">RU</button>
            <button id="lang-en" type="button">EN</button>
        </div>
    </div>
    <nav class="pages" id="nav"></nav>
    <main id="page"></main>
    <div class="status-foot" id="foot"></div>
</div>
<script src="app.js"></script>
</body>
</html>

# Resolver for AmneziaWG tunnel clients. Recursive, not forwarding.
server:
    verbosity: 0
    # Answers are only ever wanted from inside a container network, so binding
    # the wildcard is fine — reachability is decided by which docker networks
    # this container is on, not by a bind address.
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Default deny. The allowed ranges are the DNS bridge itself and the RFC1918
    # space the tunnels are numbered out of; everything else is refused rather
    # than answered, so a misrouted query fails loudly.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.29.172.0/24 allow
    access-control: 10.0.0.0/8 allow

    # Nothing here should identify the server, and nothing should be logged: the
    # query stream is the thing a client came to this resolver to protect.
    hide-identity: yes
    hide-version: yes
    log-queries: no
    log-replies: no
    use-syslog: no
    # Counts by answer code, for the dns.vpn page. Counters only: no name is
    # ever kept.
    extended-statistics: yes

    # Ask each authoritative server only for as much of the name as it needs.
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    aggressive-nsec: yes

    # Answers for private space must never come back from the public DNS.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # One tunnel's worth of clients, on a container meant to stay small.
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    cache-min-ttl: 60
    cache-max-ttl: 3600
    prefetch: yes

    # No chroot: the container is the jail, and chrooting inside it only makes
    # the paths harder to reason about.
    chroot: ""
    directory: "/etc/unbound"
    username: "unbound"
    pidfile: ""

    # Alpine ships the root trust anchor with the package; DNSSEC validation is
    # what makes recursing from the root worth doing.
    #
    # `trust-anchor-file`, not `auto-trust-anchor-file`: the automatic form
    # rewrites the anchor in place for RFC 5011 rollovers, which a read-only
    # container cannot do — it does not degrade, it refuses to start. A root KSK
    # rollover is announced years ahead and arrives here as a new base image.
    trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"

    # A name answered from this file itself, no upstream involved. The health
    # check asks for it: a YES answer proves the resolver is alive and the UDP
    # path works, without the check's verdict depending on the internet being
    # reachable — a resolver that is up while the uplink is down is healthy,
    # and an orchestrator should not restart it for that.
    local-zone: "health.awg.internal." static
    local-data: "health.awg.internal. 60 IN A 127.0.0.1"

    # Answers that leave nothing extra on the wire and nothing to amplify:
    # ANY gets the short answer, responses carry only what was asked, and
    # an upstream that floods gets rate limited per zone. No per-client limit:
    # every tunnel client arrives through the node's NAT as one address.
    deny-any: yes
    minimal-responses: yes
    ratelimit: 1000
    # A stale answer beats none while an authority is unreachable, for an
    # hour at most, and only after the fresh lookup had 1.8 s to come back.
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1800

    # For forward mode over TLS: the upstream's certificate is checked against
    # the system bundle and the name after `#` in each forward-addr.
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    # Everything the operator can change (the .vpn zone and the pages in it,
    # block and allow lists, their own records, peer names, the mode) is
    # generated by entrypoint-dns.sh into this file, which always exists by the
    # time unbound starts. See containers/README.md.
    include: "/run/awg-dns/generated.conf"

# Reloads and statistics, for the entrypoint inside this container only: the
# loopback interface and nothing else, so a tunnel client that can reach the
# resolver cannot reach its controls.
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

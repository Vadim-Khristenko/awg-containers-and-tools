# Resolver for AmneziaWG tunnel clients. Recursive, not forwarding.
server:
    verbosity: 0
    # Answers are only ever wanted from inside a container network, so binding
    # the wildcard is fine — reachability is decided by which docker networks
    # this container is on, not by a bind address.
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Default deny. The allowed ranges are the DNS bridge itself and the RFC1918
    # space the tunnels are numbered out of; everything else is refused rather
    # than answered, so a misrouted query fails loudly.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.29.172.0/24 allow
    access-control: 10.0.0.0/8 allow

    # Nothing here should identify the server, and nothing should be logged: the
    # query stream is the thing a client came to this resolver to protect.
    hide-identity: yes
    hide-version: yes
    log-queries: no
    log-replies: no
    use-syslog: no

    # Ask each authoritative server only for as much of the name as it needs.
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    aggressive-nsec: yes

    # Answers for private space must never come back from the public DNS.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # One tunnel's worth of clients, on a container meant to stay small.
    num-threads: 1
    msg-cache-size: 8m
    rrset-cache-size: 16m
    cache-min-ttl: 60
    cache-max-ttl: 3600
    prefetch: yes

    # No chroot: the container is the jail, and chrooting inside it only makes
    # the paths harder to reason about.
    chroot: ""
    directory: "/etc/unbound"
    username: "unbound"
    pidfile: ""

    # Alpine ships the root trust anchor with the package; DNSSEC validation is
    # what makes recursing from the root worth doing.
    #
    # `trust-anchor-file`, not `auto-trust-anchor-file`: the automatic form
    # rewrites the anchor in place for RFC 5011 rollovers, which a read-only
    # container cannot do — it does not degrade, it refuses to start. A root KSK
    # rollover is announced years ahead and arrives here as a new base image.
    trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"

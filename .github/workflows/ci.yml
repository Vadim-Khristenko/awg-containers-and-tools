name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Warnings are errors here on purpose: more than one bug in this project
      # started life as a clippy warning nobody acted on.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Linux-only CI is how a bug that only exists on Windows ships: the tool
  # resolved its config directory from HOME, which Windows does not set, so
  # every command touching a saved profile failed there while CI stayed green.
  # Building for Windows in the release job was not enough — nothing ran.
  cross:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A script committed without its exec bit works for whoever added it and
      # fails everywhere else. Git records the mode; a Windows working copy
      # cannot, so it has to be checked rather than assumed.
      - name: Every script is executable
        run: |
          bad=$(git ls-files -s containers/ \
            | awk '$1 != "100755" && ($4 ~ /\.sh$/ || $4 ~ /awg-(peer|uapi)$/) { print $4 }')
          if [ -n "$bad" ]; then
            echo "not executable in the index:"; echo "$bad"
            echo "fix with: git update-index --chmod=+x <file>"
            exit 1
          fi
          echo "all executable"

      - name: Shell syntax
        run: |
          for f in $(git ls-files 'containers/**' | grep -E '\.sh$|awg-peer$|awg-uapi$'); do
            bash -n "$f" || exit 1
          done
          echo "all parse"

  images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: amnezia-wg-1,  awg: "1.0", go: v0.2.12 }
          - { image: amnezia-wg-15, awg: "1.5", go: v0.2.14-beta-awg-1.5-1 }
          - { image: amnezia-wg-2,  awg: "2.0", go: v0.2.19 }
          - { image: amnezia-wg-3,  awg: "3.0", go: v3.0.2 }
          - { image: amnezia-wg-31, awg: "3.1", go: v3.1.20260814 }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build only. Publishing happens on a tag, in release.yml.
      - uses: docker/build-push-action@v7
        with:
          context: containers
          push: false
          build-args: |
            AWG_VERSION=${{ matrix.awg }}
            AWG_GO_VERSION=${{ matrix.go }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  dns-image:
    name: Build amnezia-wg-dns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: containers
          file: containers/Dockerfile.dns
          push: false
          cache-from: type=gha,scope=dns
          cache-to: type=gha,mode=max,scope=dns

  status-image:
    name: Build amnezia-wg-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: containers
          file: containers/Dockerfile.status
          push: false
          cache-from: type=gha,scope=status
          cache-to: type=gha,mode=max,scope=status

  # The release publishes every image for amd64 and arm64, but building all
  # five under emulation on every push would triple the image job for little:
  # the Go source compiles the same either way. One image, one foreign
  # platform, no push — enough to catch the two ways an arch actually breaks
  # (a base image without the architecture, a package that does) before a
  # release runs into them.
  arm64-canary:
    name: arm64 canary (amnezia-wg-31)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: containers
          file: containers/Dockerfile
          push: false
          platforms: linux/arm64
          build-args: |
            AWG_VERSION=3.1
            AWG_GO_VERSION=v3.1.20260814
          cache-from: type=gha,scope=arm64-canary
          cache-to: type=gha,mode=max,scope=arm64-canary

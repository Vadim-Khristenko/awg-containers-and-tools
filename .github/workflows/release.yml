name: Release

# Tag a commit to release it:
#
#     git tag -s v0.2.0 -m "v0.2.0"
#     git push origin v0.2.0
#
# Images are pushed to Docker Hub only if both of these are configured:
#   vars.DOCKERHUB_USERNAME     repository variable — the account (vaiprog)
#   secrets.DOCKERHUB_TOKEN     repository secret   — token with Read/Write
# The username is a variable rather than a secret deliberately: it is not one,
# and keeping it visible means the logs show which account was pushed to.
# Without them the release still happens, with binaries but no images, and the
# notes say so rather than pointing at tags that were never pushed.
#
# The live tunnel tests are deliberately not part of this pipeline; they need
# /dev/net/tun and privileged containers. Run `Live tunnel tests` by hand
# before tagging.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.creds.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The `secrets` context is not available in a job-level `if`, so the
      # answer has to be computed in a step and passed along as an output.
      - id: creds
        name: Are Docker Hub credentials configured?
        env:
          USER_SET: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USER_SET" ] && [ -n "$TOKEN_SET" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set — images will not be published."
          fi

  binaries:
    name: Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: ".exe" }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: "" }
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin awg-tool

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/awg-tool${{ matrix.ext }}" \
             "dist/awg-tool-${{ matrix.target }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: awg-tool-${{ matrix.target }}
          path: dist/*

  publish-images:
    name: Publish ${{ matrix.image }}
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: amnezia-wg-1,   awg: "1.0", go: v0.2.12, file: Dockerfile }
          - { image: amnezia-wg-15,  awg: "1.5", go: v0.2.14-beta-awg-1.5-1, file: Dockerfile }
          - { image: amnezia-wg-2,   awg: "2.0", go: v0.2.19, file: Dockerfile }
          - { image: amnezia-wg-3,   awg: "3.0", go: v3.0.2,  file: Dockerfile }
          - { image: amnezia-wg-31,  awg: "3.1", go: v3.1.20260814, file: Dockerfile }
          - { image: amnezia-wg-dns, awg: "dns", go: "-",     file: Dockerfile.dns }
          - { image: amnezia-wg-status, awg: "status", go: "-", file: Dockerfile.status }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Hash exactly the things that can change what ends up inside the image.
      # A tag on its own is not evidence of a change: most releases touch the
      # Rust side only, and rebuilding five identical images every time burns
      # runner minutes, moves `latest` for no reason, and hands users a new
      # digest to re-pull that contains nothing new.
      - id: inputs
        name: Fingerprint the build inputs
        run: |
          # Invoked through `sh` rather than as `./…`: the exec bit is a git
          # index attribute that a Windows checkout cannot express, and a
          # release should not fail on where the commit was authored.
          h=$(sh containers/inputs-digest.sh "${{ matrix.awg }}" "${{ matrix.go }}")
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "fingerprint: $h"

      - id: existing
        name: What is published under :latest right now?
        continue-on-error: true
        run: |
          ref="${{ env.REGISTRY_USER }}/${{ matrix.image }}:latest"
          if docker pull -q "$ref" >/dev/null 2>&1; then
            prev=$(docker inspect --format '{{ index .Config.Labels "space.vai-rice.awg.inputs" }}' "$ref" 2>/dev/null || true)
            echo "previous=$prev" >> "$GITHUB_OUTPUT"
            echo "published fingerprint: ${prev:-<none>}"
          else
            echo "previous=" >> "$GITHUB_OUTPUT"
            echo "nothing published yet"
          fi

      - name: Build and push
        if: steps.existing.outputs.previous != steps.inputs.outputs.hash
        uses: docker/build-push-action@v7
        with:
          context: containers
          file: containers/${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            AWG_VERSION=${{ matrix.awg }}
            AWG_GO_VERSION=${{ matrix.go }}
            INPUTS_DIGEST=${{ steps.inputs.outputs.hash }}
          tags: |
            ${{ env.REGISTRY_USER }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY_USER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Unchanged: give the release its version tag without producing a second
      # copy of identical bytes. imagetools points a new tag at the existing
      # multi-arch index, so `:v0.2.0` and `:latest` share one digest.
      - name: Re-tag the unchanged image
        if: steps.existing.outputs.previous == steps.inputs.outputs.hash
        run: |
          docker buildx imagetools create \
            -t "${{ env.REGISTRY_USER }}/${{ matrix.image }}:${{ github.ref_name }}" \
            "${{ env.REGISTRY_USER }}/${{ matrix.image }}:latest"
          echo "::notice::${{ matrix.image }} unchanged — tagged ${{ github.ref_name }} onto the existing digest"

      - name: Record what happened
        run: |
          mkdir -p imginfo
          if [ "${{ steps.existing.outputs.previous }}" = "${{ steps.inputs.outputs.hash }}" ]; then
            state=unchanged
          else
            state=rebuilt
          fi
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY_USER }}/${{ matrix.image }}:${{ github.ref_name }}" \
            --format '{{ .Manifest.Digest }}' 2>/dev/null || echo unknown)
          printf '%s|%s|%s|%s\n' "${{ matrix.image }}" "${{ matrix.awg }}" "$state" "$digest" \
            > "imginfo/${{ matrix.image }}.txt"
          cat "imginfo/${{ matrix.image }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: imginfo-${{ matrix.image }}
          path: imginfo/*

  # The Docker Hub overview pages are pushed by their own workflow, `hub.yml`.
  # They were a job here until a 403 from Docker's login endpoint failed a
  # release whose images had all published correctly — a release should be red
  # because something shipped wrong, not because a description did not update.

  release:
    name: GitHub release
    needs: [binaries, publish-images]
    # The publish job is skipped when there are no credentials, and a skipped
    # dependency would skip this job too — so the condition is decided here.
    if: always() && needs.binaries.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The pattern is not optional. docker/build-push-action uploads a build
      # record artifact of its own for every image it pushes, and without a
      # filter those land in the release next to the binaries.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: awg-tool-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: imginfo
          pattern: imginfo-*
          merge-multiple: true

      # Named after the tag, so several releases downloaded into one directory
      # do not overwrite each other's checksums — and so the verify command
      # says which release it is verifying.
      #
      # Written outside the directory and moved in: `sha256sum * > file` in
      # place works only because the glob expands before the redirect creates
      # the file, and a leftover from an earlier run would quietly checksum
      # itself.
      - name: Checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ( cd artifacts && sha256sum awg-tool-* ) > "checksums-${TAG}.sha256"
          mv "checksums-${TAG}.sha256" artifacts/
          cat "artifacts/checksums-${TAG}.sha256"

      - name: Compose the notes
        env:
          TAG: ${{ github.ref_name }}
          PUBLISHED: ${{ needs.publish-images.result }}
        run: |
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "docker pull ${REGISTRY_USER:-vaiprog}/amnezia-wg-3:$TAG"
            echo '```'
            echo
            echo "Or take a binary below and run it with no arguments for the interactive UI."
            echo

            if [ "$PUBLISHED" = "success" ] && [ -d imginfo ] && [ -n "$(ls -A imginfo 2>/dev/null)" ]; then
              echo "## Images"
              echo
              echo "| Image | Protocol | This release | Digest |"
              echo "|---|---|---|---|"
              for f in imginfo/*.txt; do
                IFS='|' read -r image awg state digest < "$f"
                case "$awg" in dns) proto="resolver" ;; *) proto="AWG $awg" ;; esac
                case "$state" in
                  unchanged) note="unchanged — re-tagged" ;;
                  *)         note="rebuilt" ;;
                esac
                printf '| `%s/%s:%s` | %s | %s | `%s` |\n' \
                  "${REGISTRY_USER:-vaiprog}" "$image" "$TAG" "$proto" "$note" "${digest:0:19}"
              done
              echo
              echo "Images marked *unchanged* are the same bytes as the previous release under a new tag — nothing to re-pull."
              echo
            else
              echo "## Images"
              echo
              echo "Container images were **not** published for this tag: Docker Hub credentials are not configured on this repository. Build them from source with \`containers/build.sh\`."
              echo
            fi

            echo "## Binaries"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in artifacts/awg-tool-*; do
              n=$(basename "$f")
              printf '| `%s` | %s | `%s` |\n' \
                "$n" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -c1-16)…"
            done
            echo
            echo "Unsigned. Verify what you downloaded:"
            echo
            echo '```bash'
            echo "sha256sum -c checksums-$TAG.sha256"
            echo '```'
            echo
            echo "---"
            echo
            echo "Unofficial community build. Not affiliated with, endorsed by or supported by AmneziaVPN."
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          body_path: notes.md

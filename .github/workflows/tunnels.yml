name: Live tunnel tests

# These bring up real tunnels: they need /dev/net/tun, privileged containers
# and several minutes, so they do not run on every push. Trigger them by hand
# before a release, and weekly so that upstream changes to the base images do
# not rot unnoticed.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  tunnels:
    name: All five generations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Make sure the tun device exists
        run: |
          sudo modprobe tun || true
          test -c /dev/net/tun

      # Belt and braces. The `scripts` job in CI fails when a script is
      # committed without its exec bit, which is where that gets fixed
      # properly — but a run that is about to spend forty minutes on live
      # tunnels should not die on chmod.
      - name: Make sure the scripts are runnable
        run: chmod +x containers/*.sh containers/awg-peer containers/awg-uapi

      # The self test drives the tunnel through awg-tool, and the binary has
      # to exist before the first tunnel comes up. This was the quiet killer
      # of every scheduled run: the images built fine, and then selftest.sh
      # died on a path that nothing in this workflow had ever produced. The
      # debug profile is enough — these are live checks, not benchmarks.
      - name: Build awg-tool
        run: cargo build --workspace

      - name: Build images
        run: cd containers && ./build.sh

      # A handshake, ICMP both ways and a 4 MiB transfer with matching
      # checksums, per generation. "It started" is not the same as "it works".
      - name: Self test
        run: cd containers && sudo ./selftest.sh

      - name: All five at once
        run: cd containers && sudo ./paralleltest.sh

      - name: DNS leak protection
        run: cd containers && sudo ./dnstest.sh

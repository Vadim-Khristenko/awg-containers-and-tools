name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste anything:** remove every private key, pre-shared key
        and `HeaderProtectionKey` value. If one has already been posted
        somewhere, regenerate it rather than hoping nobody looked.

  - type: dropdown
    id: version
    attributes:
      label: Protocol version
      options: ["1.0", "1.5", "2.0", "3.0"]
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client
      description: e.g. AmneziaVPN on Android, AmneziaWG Windows, Keenetic
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where does it fail?
      options:
        - When importing the config
        - During the handshake
        - After traffic starts
        - Generating the config with awg-tool
        - Installing the server
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: params
    attributes:
      label: Generated parameters
      description: The obfuscation parameters, with the keys removed.
      render: ini

  - type: textarea
    id: daemon
    attributes:
      label: Daemon state
      description: Output of `awg-uapi get` and the container log.
      render: shell
